<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<script>(function(){var m=location.pathname.match(/^(.*?)\/(room|display)\//);var b=m?m[1]+'/':location.pathname.replace(/[^/]*$/,'');document.write('<base href="'+b+'">');})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AU LOUP !</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js"}}</script>
</head>
<body>
<div id="splash" class="splash" hidden>
  <img src="assets/logo.png" alt="AU LOUP !" width="326" height="84">
  <p>Le jeu de bluff où il faut faire entrer les moutons… sans laisser passer le loup.</p>
  <button id="splash-play" class="gold">Jouer</button>
  <button id="splash-rules">Comment on joue ?</button>
</div>
<header class="hud">
  <img class="logo" src="assets/logo.png" alt="AU LOUP !" width="217" height="56">
  <div id="chips"></div>
  <div class="opts">
    <button id="share" class="small gold">Partager</button>
    <button id="rules-open" class="small">Règles illustrées</button>
    <label><input type="checkbox" id="calm"> Mouvements réduits</label>
    <label><input type="checkbox" id="mute" checked> Sans son</label>
  </div>
</header>
<section id="scene" class="scene" aria-label="Prairie et enclos">
  <div id="menu"></div>
  <div id="toast" role="status"></div>
</section>
<main id="app"></main>
<div id="rules" class="modal" role="dialog" aria-modal="true" aria-label="Règles illustrées" hidden>
  <div class="modal-box"><button id="rules-close" class="red">Fermer</button><div id="rules-body"></div></div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
